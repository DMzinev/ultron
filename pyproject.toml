[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-risk-scorer"
dynamic = ["version"]
description = "AI-Assisted Software Architecture Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
tray = [
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
]
metrics = [
    "radon>=5.1.0",
]
dev = [
    "radon>=5.1.0",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
]

[project.scripts]
ultron = "ultron.interfaces.ultron:main"
ultron-server = "ultron.interfaces.server:main"
ultron-mcp = "ultron.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultron*"]
exclude = [
    "ultron.tests*",
    "ultron.validation*",
    "ultron.scratch*",
    "umags*",
    "synapse_project*"
]

[tool.setuptools.dynamic]
version = {attr = "ultron._version.__version__"}

[tool.setuptools.package-data]
"ultron.interfaces" = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/modules/*.js",
    "web/*.json"
]
"ultron" = [
    "resources/*.json"
]
"ultron.core.rkm" = [
    "migrations/*.sql",
    "rulepacks/**/*.json"
]
