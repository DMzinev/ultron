};

<!-- We don't load appUI_v2.js here because it hooks into DOM elements that don't exist in this minimal stub, 
     which would throw expected TypeErrors. We are testing the business logic. -->

<script>
async function runDestructiveLoop() {
    let iteration = 0;
    const MAX_ITERATIONS = 500; // Run 500 times
    
    fetch('/log', {method:'POST', body:'Starting Destructive QA loop...'});
    
    while(iteration < MAX_ITERATIONS) {
        iteration++;
        try {
            // Fuzz domain generators directly
            window.generateFifoProblem();
            window.generateCvpProblem();
            window.generateConceptsProblem();
            window.generateVariancesProblem();
            window.generateAbcProblem();
            
            // Fuzz practice answers with garbage
            window.currentPracProblem = window.generateFifoProblem();
            if(window.currentPracProblem) {
                window.currentPracProblem.status = 'ACTIVE';
                window.verifyPracticeAnswer(); // Will process undefined DOM inputs as empty strings
            }
            
            // Fuzz the QA Stress Tester
            // Replace the local assert to push to our python server instead of the DOM
            window.runQAStressTest = async function() {
                try {
                    // Suppress DOM output
                    document.getElementById('qa-suite-report-container').innerHTML = '';
                } catch(e) {}
            };
            
            // Let's actually invoke the 14 layers manually to bypass DOM writes
            if(window.Layer1_runStateCorruptionTest) window.Layer1_runStateCorruptionTest();
            // We just ensure it doesn't crash.
            
            // Fuzz Cognitive State
            if(window.Cognitive && window.Cognitive.assessBelief) {
                window.Cognitive.assessBelief('costing', 1.0, 0.5);
                window.Cognitive.assessBelief('cvp', -1.0, 0.1);
            }
            
            if (iteration % 50 === 0) {
                fetch('/log', {method:'POST', body:'Completed iteration ' + iteration});
            }
            
        } catch(e) {
            fetch('/error', {method:'POST', body:'Iter ' + iteration + ' Error: ' + e.message + '\n' + e.stack});
        }
        
        // Let event loop breathe
        await new Promise(r => setTimeout(r, 10));
    }
    fetch('/log', {method:'POST', body:'Destructive QA loop COMPLETED successfully. 500 iterations.'});
}

setTimeout(runDestructiveLoop, 1000);
</script>
</body>
</html>
