  +  +    duration_ms INTEGER NOT NULL,
  +  +    engine_version TEXT NOT NULL,
  +  +    rule_version TEXT NOT NULL,
  +  +    FOREIGN KEY (analysis_run_id) REFERENCES rkm_analysis_runs (id) ON DELETE CASCADE,
