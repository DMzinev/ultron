  +    feedback_path = os.path.join(
  +        os.path.dirname(os.path.abspath(__file__)), "..", "meta", "human_feedback.jsonl"
  +    )
  +    feedback = {}
  +    if not os.path.exists(feedback_path):
  +        return feedback
  +    try:
  +        with open(feedback_path, "r", encoding="utf-8") as f:
  +            for line in f:
