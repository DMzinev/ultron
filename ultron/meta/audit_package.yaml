  +    overflow-y: auto;
  +    font-family: ui-monospace, SFMono-Regular, JetBrains Mono, Consolas, monospace;
  +    font-size: 0.85rem;
  +}
  +
  +.empty-state {
  +    display: flex;
  +    align-items: center;
  +    justify-content: center;
  +    height: 100%;
  +    color: var(--text-muted);
  +    text-align: center;
  +    padding: 3rem 0;
  +}
  +
  +/* Tree Styling */
  +.tree-node {
  +    margin-left: 1.25rem;
  +    position: relative;
  +}
  +
  +.tree-node::before {
  +    content: '';
  +    position: absolute;
  +    left: -0.75rem;
  +    top: 0;
  +    bottom: 0;
  +    width: 1px;
  +    background: rgba(255, 255, 255, 0.05);
  +}
  +
  +.tree-node:last-child::before {
  +    height: 0.65rem;
  +}
  +
  +.tree-row {
  +    display: flex;
  +    align-items: center;
  +    padding: 0.3rem 0.5rem;
  +    border-radius: 4px;
  +    cursor: pointer;
  +    user-select: none;
  +    transition: background 0.15s;
  +    margin: 0.1rem 0;
  +    gap: 0.5rem;
  +}
  +
  +.tree-row:hover {
  +    background: rgba(255, 255, 255, 0.03);
  +}
  +
  +.node-arrow {
  +    display: inline-block;
  +    width: 10px;
  +    color: var(--text-muted);
  +    font-size: 0.65rem;
  +    transition: transform 0.15s;
  +    text-align: center;
  +}
  +
  +.node-arrow.expanded {
  +    transform: rotate(90deg);
  +}
  +
  +.node-icon {
  +    font-size: 0.9rem;
  +    margin-right: 0.1rem;
  +}
  +
  +.node-name {
  +    flex-grow: 1;
  +    color: var(--text-primary);
  +}
  +
  +.node-risk-chip {
  +    padding: 0.1rem 0.4rem;
  +    border-radius: 4px;
  +    font-size: 0.7rem;
  +    font-weight: 700;
  +    text-transform: uppercase;
  +}
  +
  +/* Risk Card Styling inside tree */
  +.level-high {
  +    background: var(--color-high-bg);
  +    border: 1px solid var(--color-high-border);
  +    color: #fca5a5;
  +    box-shadow: inset 0 0 4px rgba(239, 68, 68, 0.1);
  +}
  +
  +.level-medium {
  +    background: var(--color-medium-bg);
  +    border: 1px solid var(--color-medium-border);
  +    color: #fcd34d;
  +    box-shadow: inset 0 0 4px rgba(245, 158, 11, 0.1);
  +}
  +
  +.level-low {
  +    background: var(--color-low-bg);
  +    border: 1px solid var(--color-low-border);
  +    color: #6ee7b7;
  +}
  +
  +/* Floating custom tooltip */
  +.tooltip {
  +    position: absolute;
  +    z-index: 1000;
  +    background: rgba(15, 23, 42, 0.95);
  +    border: 1px solid var(--border-color);
  +    border-radius: 8px;
  +    padding: 0.8rem 1rem;
  +    max-width: 350px;
  +    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.1);
  +    font-size: 0.8rem;
  +    pointer-events: none;
  +    backdrop-filter: blur(5px);
  +    transition: opacity 0.1s;
  +}
  +
  +.tooltip.hidden {
  +    opacity: 0;
  +    pointer-events: none;
  +    display: none;
  +}
  +
  +.tooltip-title {
  +    font-weight: 700;
  +    color: var(--text-primary);
  +    margin-bottom: 0.25rem;
  +    font-family: ui-monospace, SFMono-Regular, JetBrains Mono, Consolas, monospace;
  +}
  +
  +.tooltip-metric {
  +    display: flex;
  +    justify-content: space-between;
  +    font-size: 0.75rem;
  +    color: var(--text-secondary);
  +    margin-bottom: 0.5rem;
  +    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  +    padding-bottom: 0.25rem;
  +}
  +
  +.tooltip-desc {
  +    color: var(--text-primary);
  +    line-height: 1.4;
  +}
