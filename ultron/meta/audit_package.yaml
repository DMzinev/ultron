  diff --git a/ultron/core/rkm/snapshot.py b/ultron/core/rkm/snapshot.py
  new file mode 100644
  index 0000000..0dca94e
  --- /dev/null
  +++ b/ultron/core/rkm/snapshot.py
  @@ -0,0 +1,144 @@
  +import os
  +import json
  +import sqlite3
  +from ultron.core.rkm.store import RepositoryStore
  +from ultron.core.rkm.schema import RKM_SCHEMA_VERSION
  +
  +def export_snapshot(db_path: str, output_json_path: str):
  +    """
  +    Reads all SQLite RKM tables and exports them as a JSON snapshot.
  +    """
  +    os.makedirs(os.path.dirname(os.path.abspath(db_path)), exist_ok=True)
  +    os.makedirs(os.path.dirname(os.path.abspath(output_json_path)), exist_ok=True)
  +    
  +    conn = sqlite3.connect(db_path)
  +    conn.row_factory = sqlite3.Row
  +    try:
  +        tables = {
  +            "metadata": "rkm_metadata",
  +            "analysis_runs": "rkm_analysis_runs",
  +            "files": "rkm_files",
  +            "symbols": "rkm_symbols",
  +            "dependencies": "rkm_dependencies",
  +            "facts": "rkm_facts",
  +            "provenance": "rkm_provenance",
  +            "interpretations": "rkm_interpretations",
  +            "recommendations": "rkm_recommendations",
  +            "metrics": "rkm_metrics",
  +            "architecture": "rkm_architecture"
  +        }
  +        
  +        snapshot = {
  +            "snapshot_version": "1.0.0",
  +            "rkm_version": RKM_SCHEMA_VERSION
  +        }
  +        
  +        for key, table_name in tables.items():
  +            try:
  +                cursor = conn.execute(f"SELECT * FROM {table_name}")
  +                snapshot[key] = [dict(row) for row in cursor]
  +            except sqlite3.OperationalError:
  +                # If table doesn't exist (e.g. migration 002 provenance on older db), default to empty list
  +                snapshot[key] = []
  +                
  +        # Export single metadata row as a dictionary
  +        if snapshot["metadata"]:
  +            snapshot["metadata"] = snapshot["metadata"][0]
  +        else:
  +            snapshot["metadata"] = {}
  +            
  +        with open(output_json_path, "w", encoding="utf-8") as f:
  +            json.dump(snapshot, f, indent=2, ensure_ascii=False)
  +            
  +    finally:
  +        conn.close()
  +
  +def import_snapshot(db_path: str, input_json_path: str):
  +    """
  +    Imports RKM data from a JSON snapshot into the SQLite database.
  +    Performs atomic file swap replacement to prevent data corruption.
  +    """
  +    if not os.path.exists(input_json_path):
  +        raise ValueError(f"Snapshot file not found: {input_json_path}")
  +        
  +    try:
  +        with open(input_json_path, "r", encoding="utf-8") as f:
  +            snapshot = json.load(f)
  +    except OSError as e:
  +        raise ValueError(f"Failed to read snapshot file: {e}")
  +    except json.JSONDecodeError as e:
  +        raise ValueError(f"Invalid JSON snapshot format: {e}")
  +        
  +    if not isinstance(snapshot, dict) or "snapshot_version" not in snapshot:
  +        raise ValueError("Invalid snapshot structure: missing metadata block")
  +        
  +    # Setup temporary database
  +    temp_db_path = db_path + ".temp"
  +    if os.path.exists(temp_db_path):
  +        try:
  +            os.remove(temp_db_path)
  +        except OSError:
  +            temp_db_removal_failed = True
  +
  +            
  +    os.makedirs(os.path.dirname(os.path.abspath(db_path)), exist_ok=True)
  +    
  +    # Initialize the temp DB (runs migrations to ensure schemas are up-to-date)
  +    temp_store = RepositoryStore(temp_db_path)
  +    temp_store.close()
  +    
  +    conn = sqlite3.connect(temp_db_path)
  +    try:
  +        conn.execute("PRAGMA foreign_keys = OFF;")
  +        
  +        tables = [
  +            ("rkm_metadata", "metadata"),
  +            ("rkm_analysis_runs", "analysis_runs"),
  +            ("rkm_files", "files"),
  +            ("rkm_symbols", "symbols"),
  +            ("rkm_dependencies", "dependencies"),
  +            ("rkm_facts", "facts"),
  +            ("rkm_provenance", "provenance"),
  +            ("rkm_interpretations", "interpretations"),
  +            ("rkm_recommendations", "recommendations"),
  +            ("rkm_metrics", "metrics"),
  +            ("rkm_architecture", "architecture")
  +        ]
  +        
  +        with conn:
  +            for table_name, key in tables:
  +                data = snapshot.get(key, [])
  +                if key == "metadata":
  +                    if isinstance(data, dict) and data:
  +                        data = [data]
  +                    else:
  +                        data = []
  +                        
  +                for row_dict in data:
  +                    columns = list(row_dict.keys())
  +                    placeholders = ", ".join("?" for _ in columns)
  +                    sql = f"INSERT OR REPLACE INTO {table_name} ({', '.join(columns)}) VALUES ({placeholders})"
  +                    conn.execute(sql, tuple(row_dict[c] for c in columns))
  +                    
  +        conn.execute("PRAGMA foreign_keys = ON;")
  +    finally:
  +        conn.close()
  +        
  +    # Atomically replace live DB with imported temp DB
  +    # Note: caller must ensure all active store connections to db_path are closed!
  +    try:
  +        if os.path.exists(db_path):
  +            os.remove(db_path)
  +    except OSError:
  +        db_removal_failed = True
  +        
  +    try:
  +        os.replace(temp_db_path, db_path)
  +    except OSError as e:
  +        # Cleanup temp file on failure
  +        try:
  +            os.remove(temp_db_path)
  +        except OSError:
  +            temp_cleanup_failed = True
  +        raise ValueError(f"Failed to atomically swap database file: {e}")
  +
  diff --git a/ultron/core/rkm/store.py b/ultron/core/rkm/store.py
  new file mode 100644
  index 0000000..470d2dd
  --- /dev/null
  +++ b/ultron/core/rkm/store.py
  @@ -0,0 +1,770 @@
  +import os
  +import sqlite3
  +import json
  +from datetime import datetime
  +from contextlib import contextmanager
  +from ultron.core.rkm.schema import (
  +    RepositoryMetadata, AnalysisRun, FileRecord, SymbolRecord,
  +    DependencyRecord, FactRecord, InterpretationRecord, RecommendationRecord,
  +    MetricRecord, ArchitectureRecord, ProvenanceRecord, RkmManifest,
  +    RkmRule, RkmRuleInstance, RkmEvaluation, RkmViolation, RkmViolationEvidence,
  +    EvaluationStatus, RKM_SCHEMA_VERSION, RKM_COMPATIBILITY
  +)
  +
  +class AppliedMigration:
  +    def __init__(self, id: int, version: str, applied_at: str):
  +        self.id = id
  +        self.version = version
  +        self.applied_at = applied_at
  +
  +class RepositoryStore:
  +    def __init__(self, db_path: str):
  +        self.db_path = db_path
  +        # Ensure parent directory exists
  +        db_dir = os.path.dirname(os.path.abspath(db_path))
  +        os.makedirs(db_dir, exist_ok=True)
  +        
  +        self.conn = sqlite3.connect(db_path)
  +        self.conn.row_factory = sqlite3.Row
  +        self.conn.execute("PRAGMA foreign_keys = ON;")
  +        self._run_migrations()
  +        self._check_compatibility()
  +
  +    def parse_version(self, v_str: str) -> tuple[int, ...]:
  +        if not isinstance(v_str, str) or not v_str.strip():
  +            raise ValueError("Invalid version string")
  +        return tuple(int(x) for x in v_str.split("."))
  +
  +    def _check_compatibility(self):
  +        if self.conn is None:
  +            raise ValueError("Database connection is closed")
  +        try:
  +            row = self.conn.execute(
  +                "SELECT minimum_reader_version FROM rkm_manifest WHERE id = 1"
  +            ).fetchone()
  +            if not row:
  +                row = self.conn.execute(
  +                    "SELECT minimum_reader_version FROM rkm_metadata LIMIT 1"
  +                ).fetchone()
  +            if row and row["minimum_reader_version"]:
  +                db_min_reader = self.parse_version(row["minimum_reader_version"])
  +                engine_ver = self.parse_version(RKM_SCHEMA_VERSION)
  +                if db_min_reader > engine_ver:
  +                    raise ValueError(
  +                        f"Incompatible database: minimum reader version is {row['minimum_reader_version']}, "
  +                        f"but current engine RKM schema version is {RKM_SCHEMA_VERSION}"
  +                    )
  +        except (sqlite3.OperationalError, ValueError, IndexError):
  +            return
  +
  +
  +
  +
  +    def _ensure_migrations_table_has_checksum(self):
  +        self.conn.execute("""
  +            CREATE TABLE IF NOT EXISTS rkm_migrations (
  +                id INTEGER PRIMARY KEY AUTOINCREMENT,
  +                version TEXT UNIQUE NOT NULL,
  +                applied_at TEXT NOT NULL
  +            );
  +        """)
  +        self.conn.commit()
  +        
  +        cursor = self.conn.execute("PRAGMA table_info(rkm_migrations)")
  +        columns = [row["name"] for row in cursor.fetchall()]
  +        if "checksum" not in columns:
  +            self.conn.execute("ALTER TABLE rkm_migrations ADD COLUMN checksum TEXT;")
  +            self.conn.commit()
  +
  +    def _run_migrations(self):
  +        import hashlib
  +        self._ensure_migrations_table_has_checksum()
  +
  +        migrations_dir = os.path.join(os.path.dirname(__file__), "migrations")
  +        if not os.path.exists(migrations_dir):
  +            return
  +
  +        # 1. Read applied migrations from DB
  +        applied_rows = self.conn.execute("SELECT version, checksum FROM rkm_migrations").fetchall()
  +        applied_map = {row["version"]: row["checksum"] for row in applied_rows}
  +
  +        # 2. Scan and parse all migrations in migrations directory
  +        migration_nodes = {}
  +        for filename in os.listdir(migrations_dir):
  +            if filename.endswith(".sql"):
  +                filepath = os.path.join(migrations_dir, filename)
  +                with open(filepath, "r", encoding="utf-8") as f:
  +                    ddl = f.read()
  +                checksum = hashlib.sha256(ddl.replace("\r\n", "\n").encode("utf-8")).hexdigest()
  +                
  +                # Parse depends_on
  +                depends_on = []
  +                for line in ddl.splitlines():
  +                    line_strip = line.strip()
  +                    if line_strip.startswith("-- depends_on:"):
  +                        parts = line_strip.split("-- depends_on:", 1)[1].split(",")
  +                        for p in parts:
  +                            p_strip = p.strip()
  +                            if p_strip:
  +                                depends_on.append(p_strip)
  +                                
  +                migration_nodes[filename] = {
  +                    "filename": filename,
  +                    "filepath": filepath,
  +                    "ddl": ddl,
  +                    "checksum": checksum,
  +                    "depends_on": depends_on
  +                }
  +
  +        # 3. Topological sort and circular dependency check
  +        visited = {}  # version -> state (0=unvisited, 1=visiting, 2=visited)
  +        order = []
  +
  +        def visit(v):
  +            if visited.get(v, 0) == 1:
  +                raise ValueError(f"Circular dependency detected in migrations involving {v}")
  +            if visited.get(v, 0) == 2:
  +                return
  +            visited[v] = 1
  +            for dep in migration_nodes[v]["depends_on"]:
  +                if dep in migration_nodes:
  +                    visit(dep)
  +            visited[v] = 2
  +            order.append(v)
  +
  +        for filename in sorted(migration_nodes.keys()):
  +            if filename not in visited:
  +                visit(filename)
  +
  +        # 4. Apply migrations in order
  +        for filename in order:
  +            node = migration_nodes[filename]
  +            if filename in applied_map:
  +                stored_checksum = applied_map[filename]
  +                # If stored checksum is NULL (from old runs), backfill it only for legacy migrations
  +                if stored_checksum is None:
  +                    if filename in ("001_initial_schema.sql", "002_rkm_v1.1.0_upgrade.sql"):
  +                        with self.transaction():
  +                            self.conn.execute(
  +                                "UPDATE rkm_migrations SET checksum = ? WHERE version = ?",
  +                                (node["checksum"], filename)
  +                            )
  +                    else:
  +                        raise ValueError(
  +                            f"Migration '{filename}' has a NULL checksum in the database, which is "
  +                            f"prohibited for non-legacy migrations (version >= 003)."
  +                        )
  +                elif stored_checksum != node["checksum"]:
  +                    raise ValueError(
  +                        f"Migration file '{filename}' has been modified after execution! "
  +                        f"Stored checksum: {stored_checksum}, current file checksum: {node['checksum']}"
  +                    )
  +            else:
  +                # Apply migration
  +                correlation_id = f"mig-{int(datetime.now().timestamp())}"
  +                self.log_event("MIGRATION", "STARTED", filename, correlation_id, f"Applying migration {filename}")
  +                try:
  +                    with self.transaction():
  +                        self.conn.executescript(node["ddl"])
  +                        self.conn.execute(
  +                            "INSERT INTO rkm_migrations (version, checksum, applied_at) VALUES (?, ?, ?)",
  +                            (filename, node["checksum"], datetime.now().isoformat())
  +                        )
  +                    self.log_event("MIGRATION", "COMPLETED", filename, correlation_id, f"Successfully applied migration {filename}")
  +                except Exception as e:
  +                    self.log_event("MIGRATION", "FAILED", filename, correlation_id, f"Failed applying migration {filename}: {e}")
  +                    raise
  +
  +    @contextmanager
  +    def transaction(self):
  +        try:
  +            yield self.conn
  +            self.conn.commit()
  +        except Exception:
  +            self.conn.rollback()
  +            raise
