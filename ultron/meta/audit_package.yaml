  +class TestExecutionKernel(unittest.TestCase):
  +    """
  +    Verifies the functionality of ExecutionKernel, including planning,
  +    execution (with rollback), verification (AST safety and tests), and reflection.
  +    """
  +
  +    def setUp(self):
  +        import tempfile
  +        import shutil
  +        from execution_kernel import ExecutionKernel
  +
  +        self.temp_dir = tempfile.mkdtemp()
  +        self.kernel = ExecutionKernel(self.temp_dir)
  +        
  +        # Write dummy python file to repo to make it a valid scan target
  +        self.dummy_file = "ultron/core/dummy.py"
  +        self.dummy_abs = os.path.join(self.temp_dir, self.dummy_file)
  +        os.makedirs(os.path.dirname(self.dummy_abs), exist_ok=True)
  +        with open(self.dummy_abs, "w", encoding="utf-8") as f:
  +            f.write("def dummy_function():\n    return 'dummy'\n")
  +
  +    def tearDown(self):
  +        import shutil
  +        shutil.rmtree(self.temp_dir)
  +
  +    def test_kernel_init_raises_on_empty(self):
  +        from execution_kernel import ExecutionKernel
  +        with self.assertRaises(ValueError):
  +            ExecutionKernel(None)
  +        with self.assertRaises(ValueError):
  +            ExecutionKernel("")
  +
  +    def test_kernel_plan_raises_on_empty_task(self):
  +        with self.assertRaises(ValueError):
  +            self.kernel.plan("")
  +
  +    def test_kernel_plan_success(self):
  +        # We search for "dummy" keyword
  +        plan_res = self.kernel.plan("Refactor dummy functionality")
  +        self.assertIn("target_files", plan_res)
  +        self.assertIn("risks", plan_res)
  +        self.assertIn("hotspots", plan_res)
  +        self.assertIn("circular_dependencies", plan_res)
  +        self.assertIn(self.dummy_file, plan_res["target_files"])
  +
  +    def test_kernel_execute_and_rollback(self):
  +        edits = {
  +            self.dummy_file: "def dummy_function():\n    return 'changed'\n",
  +            "ultron/core/new_file.py": "def new_func():\n    return 42\n"
  +        }
  +        success = self.kernel.execute(edits)
  +        self.assertTrue(success)
  +
  +        # Confirm files are changed/created
  +        with open(self.dummy_abs, "r", encoding="utf-8") as f:
  +            self.assertEqual(f.read(), edits[self.dummy_file])
  +        new_abs = os.path.join(self.temp_dir, "ultron/core/new_file.py")
  +        self.assertTrue(os.path.exists(new_abs))
  +
  +        # Rollback
  +        self.kernel.rollback()
  +        with open(self.dummy_abs, "r", encoding="utf-8") as f:
  +            self.assertEqual(f.read(), "def dummy_function():\n    return 'dummy'\n")
  +        self.assertFalse(os.path.exists(new_abs))
  +
  +    def test_kernel_execute_type_error(self):
  +        with self.assertRaises(TypeError):
  +            self.kernel.execute("not-a-dict")
  +
  +    def test_kernel_verify_ast_safety_violation(self):
