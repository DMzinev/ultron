  +import os
  +from datetime import datetime
  +from ultron.core.rkm.schema import (
  +    FileRecord, SymbolRecord, DependencyRecord, FactRecord,
  +    InterpretationRecord, RecommendationRecord, MetricRecord, ArchitectureRecord
  +)
  +from ultron.core.risk import scoring
  +
  +class RKMRecordBatch:
  +    def __init__(self):
  +        self.files = []
  +        self.symbols = {}         # rel_path -> list[SymbolRecord]
  +        self.dependencies = {}    # rel_path -> list[DependencyRecord]
  +        self.facts = {}           # rel_path -> list[FactRecord]
  +        self.interpretations = {} # rel_path -> list[tuple[FactRecord, InterpretationRecord]]
  +        self.recommendations = {} # rel_path -> list[tuple[InterpretationRecord, RecommendationRecord]]
  +        self.metrics = {}         # rel_path -> list[MetricRecord]
  +        self.architecture = {}    # rel_path -> list[ArchitectureRecord]
  +
  +def convert_to_rkm_records(repo_path: str, codebase: dict, risks: list) -> RKMRecordBatch:
  +    batch = RKMRecordBatch()
  +    risk_map = {p.file_path: p for p in risks}
  +
  +    for rel_path, analysis in codebase.items():
  +        abs_path = os.path.join(repo_path, rel_path)
  +        
  +        # Get file metadata
  +        size = 0
  +        last_modified = ""
  +        if os.path.exists(abs_path):
  +            try:
  +                size = os.path.getsize(abs_path)
  +                last_modified = datetime.fromtimestamp(os.path.getmtime(abs_path)).isoformat()
  +            except (OSError, ValueError) as e:
  +                size = 0
  +                last_modified = ""
  +
  +        packet = risk_map.get(rel_path)
  +        if packet:
  +            role = packet.architectural_role.value
  +            complexity = packet.complexity
  +            coupling = int(packet.coupling_score)
  +            impact_score = packet.impact_score
  +            confidence = packet.confidence
  +            mitigation = packet.mitigation
  +            level = packet.level
  +        else:
  +            role = scoring.determine_architectural_role(rel_path, abs_path).value
  +            complexity = scoring.get_file_complexity(abs_path)
  +            coupling = len(analysis.get("imports", []))
  +            impact_score = float(complexity)
  +            confidence = 1.0
  +            mitigation = ""
  +            level = "LOW"
  +
  +        package = os.path.dirname(rel_path)
  +
  +        # FileRecord
  +        file_rec = FileRecord(
  +            id=None,
  +            analysis_run_id=None,
  +            path=rel_path,
  +            role=role,
  +            package=package,
  +            size=size,
  +            last_modified=last_modified,
  +            created_at=None,
  +            updated_at=None
  +        )
  +        batch.files.append(file_rec)
  +
  +        # SymbolRecord
  +        batch.symbols[rel_path] = []
  +        for defn in analysis.get("definitions", []):
  +            batch.symbols[rel_path].append(SymbolRecord(
  +                id=None,
  +                file_id=None,
  +                name=defn.get("name", ""),
  +                type=defn.get("type", "function"),
  +                lineno=defn.get("lineno", 1)
  +            ))
  +
  +        # DependencyRecord
  +        batch.dependencies[rel_path] = []
  +        for imp in analysis.get("imports", []):
  +            batch.dependencies[rel_path].append(DependencyRecord(
  +                id=None,
  +                file_id=None,
  +                target_path=imp
  +            ))
  +
  +        # Facts (complexity, coupling)
  +        batch.facts[rel_path] = []
  +        fact_complexity = FactRecord(
  +            id=None,
  +            file_id=None,
  +            category="complexity",
  +            metric="cyclomatic_complexity",
  +            value=str(complexity),
  +            value_type="integer",
  +            source_type="ast_parser",
  +            source_reference="analyzer.py:16",
  +            created_at=None,
  +            updated_at=None
  +        )
  +        batch.facts[rel_path].append(fact_complexity)
  +
  +        fact_coupling = FactRecord(
  +            id=None,
  +            file_id=None,
  +            category="coupling",
  +            metric="coupling_count",
  +            value=str(coupling),
  +            value_type="integer",
  +            source_type="dependency_analyzer",
  +            source_reference="scoring.py:214",
  +            created_at=None,
  +            updated_at=None
  +        )
  +        batch.facts[rel_path].append(fact_coupling)
  +
  +        # Interpretations and Recommendations
  +        batch.interpretations[rel_path] = []
  +        batch.recommendations[rel_path] = []
  +        if packet and level in ("MEDIUM", "HIGH"):
  +            inter = InterpretationRecord(
  +                id=None,
  +                fact_id=None,
  +                rule="coupling_count >= 3",
  +                result="Instability / high coupling detected",
  +                confidence=confidence,
  +                created_at=None,
  +                updated_at=None
  +            )
  +            batch.interpretations[rel_path].append((fact_coupling, inter))
  +
  +            if mitigation:
  +                rec = RecommendationRecord(
  +                    id=None,
  +                    interpretation_id=None,
  +                    action=mitigation,
  +                    confidence_type="heuristic",
  +                    confidence_value=confidence,
  +                    status="active",
  +                    created_at=None,
  +                    updated_at=None
  +                )
  +                batch.recommendations[rel_path].append((inter, rec))
  +
  +        # MetricRecord
  +        batch.metrics[rel_path] = []
  +        batch.metrics[rel_path].append(MetricRecord(
  +            id=None,
  +            file_id=None,
  +            name="complexity",
  +            value=float(complexity),
  +            created_at=None,
  +            updated_at=None
  +        ))
  +        batch.metrics[rel_path].append(MetricRecord(
  +            id=None,
  +            file_id=None,
  +            name="coupling",
  +            value=float(coupling),
  +            created_at=None,
  +            updated_at=None
  +        ))
  +        batch.metrics[rel_path].append(MetricRecord(
  +            id=None,
  +            file_id=None,
  +            name="hotspot_score",
  +            value=impact_score,
  +            created_at=None,
  +            updated_at=None
  +        ))
  +
  +        # ArchitectureRecord
  +        batch.architecture[rel_path] = []
  +        parts = os.path.normpath(package).split(os.sep) if package else ["root"]
  +        layer = parts[0] if parts else "root"
  +        batch.architecture[rel_path].append(ArchitectureRecord(
  +            id=None,
  +            file_id=None,
  +            layer=layer,
  +            role=role
  +        ))
  +
  +    return batch
  diff --git a/ultron/core/rkm/engine.py b/ultron/core/rkm/engine.py
  new file mode 100644
  index 0000000..81cc491
  --- /dev/null
  +++ b/ultron/core/rkm/engine.py
  @@ -0,0 +1,139 @@
  +from abc import ABC, abstractmethod
  +from typing import Any
  +import fnmatch
  +from ultron.core.rkm.schema import RkmRule, RkmViolation, RkmViolationEvidence
  +
  +class Constraint(ABC):
  +    """
  +    Abstract interface for stateless, side-effect free constraint plugins.
  +    Constraint plugins are pure functions over repository observations.
  +    """
  +    @abstractmethod
  +    def evaluate(self, store: Any, run_id: int, rule: RkmRule, config: dict[str, Any]) -> list[tuple[RkmViolation, list[RkmViolationEvidence]]]:
  +        pass
  +
  +class ComplexityConstraint(Constraint):
  +    def evaluate(self, store: Any, run_id: int, rule: RkmRule, config: dict[str, Any]) -> list[tuple[RkmViolation, list[RkmViolationEvidence]]]:
  +        max_limit = config.get("max")
  +        if max_limit is None:
  +            return []
  +        
  +        violations = []
  +        files = store.get_file_records_for_run(run_id)
  +        for f in files:
  +            metrics = store.get_metrics(f.id)
  +            for m in metrics:
  +                if m.name == "complexity" and m.value > max_limit:
  +                    vio = RkmViolation(
  +                        id=None,
  +                        evaluation_id=None,
  +                        file_id=f.id,
  +                        symbol_id=None,
  +                        details=f"File '{f.path}' complexity is {m.value}, exceeding the maximum limit of {max_limit}."
  +                    )
  +                    ev = RkmViolationEvidence(
  +                        id=None,
  +                        violation_id=None,
  +                        evidence_type="metric",
  +                        evidence_id=m.id
  +                    )
  +                    violations.append((vio, [ev]))
  +        return violations
  +
  +class CouplingConstraint(Constraint):
  +    def evaluate(self, store: Any, run_id: int, rule: RkmRule, config: dict[str, Any]) -> list[tuple[RkmViolation, list[RkmViolationEvidence]]]:
  +        max_limit = config.get("max")
  +        if max_limit is None:
  +            return []
  +        
  +        violations = []
  +        files = store.get_file_records_for_run(run_id)
  +        for f in files:
  +            metrics = store.get_metrics(f.id)
  +            for m in metrics:
  +                if m.name == "coupling" and m.value > max_limit:
  +                    vio = RkmViolation(
  +                        id=None,
  +                        evaluation_id=None,
  +                        file_id=f.id,
  +                        symbol_id=None,
  +                        details=f"File '{f.path}' coupling is {m.value}, exceeding the maximum limit of {max_limit}."
  +                    )
  +                    ev = RkmViolationEvidence(
  +                        id=None,
  +                        violation_id=None,
  +                        evidence_type="metric",
  +                        evidence_id=m.id
  +                    )
  +                    violations.append((vio, [ev]))
  +        return violations
  +
  +class LayerConstraint(Constraint):
  +    def evaluate(self, store: Any, run_id: int, rule: RkmRule, config: dict[str, Any]) -> list[tuple[RkmViolation, list[RkmViolationEvidence]]]:
  +        source_pattern = config.get("source_pattern")
  +        target_pattern = config.get("target_pattern")
  +        if not source_pattern or not target_pattern:
  +            return []
  +        
  +        violations = []
  +        files = store.get_file_records_for_run(run_id)
  +        for f in files:
  +            # Check if source file matches pattern (e.g. 'ultron/core/*')
  +            if fnmatch.fnmatch(f.path, source_pattern):
  +                deps = store.get_dependencies(f.id)
  +                for d in deps:
  +                    # check target dependency path against target pattern
  +                    # dependencies are stored as module names or paths; normalize back to paths if needed
  +                    target = d.target_path.replace(".", "/")
  +                    if fnmatch.fnmatch(target, target_pattern) or fnmatch.fnmatch(d.target_path, target_pattern):
  +                        vio = RkmViolation(
  +                            id=None,
  +                            evaluation_id=None,
  +                            file_id=f.id,
  +                            symbol_id=None,
  +                            details=f"Dependency boundary violation: File '{f.path}' (matching '{source_pattern}') "
  +                                    f"imports '{d.target_path}' (matching '{target_pattern}')."
  +                        )
  +                        ev = RkmViolationEvidence(
  +                            id=None,
  +                            violation_id=None,
  +                            evidence_type="dependency",
  +                            evidence_id=d.id
  +                        )
  +                        violations.append((vio, [ev]))
  +        return violations
  +
  +class ConstraintEngine:
  +    def __init__(self):
  +        self.plugins = {
  +            "complexity_limit": ComplexityConstraint(),
  +            "coupling_limit": CouplingConstraint(),
  +            "layer_restriction": LayerConstraint()
  +        }
  +
  +    def register_plugin(self, predicate_type: str, constraint: Constraint):
  +        self.plugins[predicate_type] = constraint
  +
  +    def evaluate_rules(self, store: Any, run_id: int, rules: list[RkmRule], instances: list[RkmRuleInstance]) -> list[tuple[RkmViolation, list[RkmViolationEvidence], RkmRule]]:
  +        # Match instances to rules
  +        instance_map = {inst.rule_id: inst for inst in instances if inst.enabled}
  +        
  +        results = []
  +        for r in rules:
  +            inst = instance_map.get(r.id)
  +            if not inst:
  +                continue
  +            
  +            plugin = self.plugins.get(r.predicate_type)
  +            if not plugin:
  +                # Unsupported predicate type
  +                continue
  +            
  +            try:
  +                violations = plugin.evaluate(store, run_id, r, inst.predicate_config)
  +                for vio, evidences in violations:
  +                    results.append((vio, evidences, r))
  +            except Exception:
  +                # Engine/plugin runtime crash would produce an ERROR evaluation, handled at pipeline level
  +                raise
  +        return results
